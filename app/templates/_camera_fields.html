<fieldset>
    <legend>Camera and lens</legend>
    <div class="field">
        <label for="cameraPreset">Camera</label>
        <select id="cameraPreset" title="Fills in sensor size and pixel pitch; check them against your spec sheet.">
            <option value="">Custom (enter sensor details below)</option>
        </select>
    </div>
    <div class="field-row">
        <div class="field">
            <label for="focalLength" title="Focal length in millimetres">Focal (mm)</label>
            <input type="number" id="focalLength" placeholder="24" step="any" min="1">
        </div>
        {% if with_aperture %}
        <div class="field">
            <label for="aperture" title="Aperture as an f-number">f-number</label>
            <input type="number" id="aperture" placeholder="1.8" step="0.1" min="0.5">
        </div>
        {% endif %}
        <div class="field">
            <label for="rotation" title="Angle of the top of the frame from north, towards east. Empty means north up.">Rotation (°)</label>
            <input type="number" id="rotation" placeholder="0" step="any">
        </div>
    </div>
    <div class="field-row">
        <div class="field">
            <label for="pixelPitch" title="Pixel pitch in micrometres">Pixel (µm)</label>
            <input type="number" id="pixelPitch" placeholder="5.93" step="0.01" min="0.5">
        </div>
        <div class="field">
            <label for="sensorWidth" title="Sensor width in pixels">Width (px)</label>
            <input type="number" id="sensorWidth" placeholder="6000" min="1">
        </div>
        <div class="field">
            <label for="sensorHeight" title="Sensor height in pixels">Height (px)</label>
            <input type="number" id="sensorHeight" placeholder="4000" min="1">
        </div>
    </div>
</fieldset>

<fieldset>
    <legend>Target</legend>
    <div class="field combo">
        <label for="targetName">Object</label>
        <input type="text" id="targetName" placeholder="Search: Orion Nebula, M 31, Vega, Cygnus…"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="targetList"
               autocomplete="off" spellcheck="false">
        <ul class="combo-list" id="targetList" role="listbox" hidden></ul>
        <p class="target-info" id="targetInfo"></p>
    </div>
    <details class="coords" id="coordsBox">
        <summary>Enter coordinates instead</summary>
        <div class="field-row">
            <div class="field">
                <label for="customRA">Right ascension (°)</label>
                <input type="number" id="customRA" step="any" min="0" max="360">
            </div>
            <div class="field">
                <label for="customDec">Declination (°)</label>
                <input type="number" id="customDec" step="any" min="-90" max="90">
            </div>
        </div>
    </details>
</fieldset>
